<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' href='style.css'>
    <script src='script.js' defer></script>
    <title>Calculator</title>
</head>
<body>
   <div class='container'>
      <div class='calculatorContainer'>
        <div class='calculatorScreen'>
            <div class='history'>
              History
            </div>
            <div class='readout'>
              Test
            </div>
        </div>
        <div class='buttonsContainer'>
          <div class='row first modifiers'>
              <button class='modifier delete'>⌫</button>
              <button class='modifier clear'>C</button>
              <button class='modifier percent'>%</button>
              <button class='function divide'>÷</button>
          </div>
          <div class='row second'>
              <button class='number one'>1</button>
              <button class='number two'>2</button>
              <button class='number three'>3</button>
              <button class='function multiply'>×</button>
          </div>
          <div class='row third'>
              <button class='number four'>4</button>
              <button class='number five'>5</button>
              <button class='number six'>6</button>
              <button class='function minus'>-</button>
          </div>
          <div class='row fourth'>
              <button class='number seven'>7</button>
              <button class='number eight'>8</button>
              <button class='number nine'>9</button>
              <button class='function plus'>+</button>
          </div>
          <div class='row fourth modifiers'>
              <button class='modifier negative'>±</button>
              <button class='number zero'>0</button>
              <button class='modifier decimal'>.</button>
              <button class='function equals'>=</button>
          </div>
        </div>
      </div>
    </div>
</body>
</html>
